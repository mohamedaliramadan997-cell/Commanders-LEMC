<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Join Commanders LEMC — UAE Chapter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<style>
  .logo-wrap { display:flex; justify-content:center; margin-bottom: 18px; }
  .logo-wrap img { width: 150px; height: 150px; object-fit: contain; border-radius: 50%; }
  .welcome-msg { text-align:center; font-size: 14px; color:#4a4735; line-height:1.6; margin-bottom: 22px; }
  .welcome-msg .brandline { font-family: var(--font-display); color: var(--gold); letter-spacing:0.06em; font-size: 13px; display:block; margin-top:6px; }
  .file-drop { border: 1.5px dashed var(--line); border-radius: 6px; padding: 16px; text-align:center; background:#fff; }
  .file-drop img.preview { max-width: 100%; max-height: 140px; margin-top: 10px; border-radius: 4px; display:none; }
  .required-mark { color: var(--red); }

  .submitted-confirmation {
    text-align: center;
    padding: 30px 10px 10px;
    animation: fadeIn 0.4s ease-out;
  }
  .submitted-confirmation .confirmation-badge {
    width: 56px; height: 56px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: var(--black);
    border: 2px solid var(--gold);
    color: var(--gold-bright);
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .submitted-confirmation h2 {
    font-family: var(--font-display);
    font-size: 22px;
    letter-spacing: 0.03em;
    color: var(--black);
    margin-bottom: 14px;
  }
  .submitted-confirmation p {
    color: #4a4735;
    font-size: 14.5px;
    line-height: 1.6;
    max-width: 440px;
    margin: 0 auto 10px;
  }
  .submitted-confirmation .confirmation-brandline {
    margin-top: 20px;
    font-family: var(--font-display);
    color: var(--gold);
    letter-spacing: 0.08em;
    font-size: 12px;
    border-top: 1px solid var(--line);
    padding-top: 16px;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="public-wrap">
    <div class="public-card">
      <div class="logo-wrap">
        <img id="club-logo" src="assets/logo.png" onerror="this.onerror=null;this.src='assets/logo-placeholder.svg';" alt="Commanders LEMC logo" />
      </div>

      <div class="public-header" style="margin-bottom:8px;">
        <h1>Join the UAE Chapter</h1>
      </div>
      <p class="welcome-msg">
        Welcome to the family. You're one form away from riding with brothers who live by one code.
        Every Hang-around starts here — fill in your details below and the Secretary will follow up.
        <span class="brandline">GOLD BLACK NATION · RESPECT ALL... FEAR NONE</span>
      </p>

      <form id="intake-form" novalidate>
        <div class="form-grid">
          <div class="full">
            <label>Full Name <span class="required-mark">*</span></label>
            <input name="full_name" data-type="name" required />
          </div>

          <div>
            <label>City <span class="required-mark">*</span></label>
            <input name="city" data-type="name" required />
          </div>
          <div>
            <label>Neighborhood <span class="required-mark">*</span></label>
            <input name="neighborhood" data-type="name" required />
          </div>

          <div>
            <label>Mobile Number <span class="required-mark">*</span></label>
            <input name="mobile" data-type="phone" required />
          </div>
          <div>
            <label>WhatsApp Number <span class="required-mark">*</span></label>
            <input name="whatsapp" data-type="phone" required />
          </div>

          <div class="full">
            <label>Email <span class="required-mark">*</span></label>
            <input name="email" type="email" data-type="email" required />
          </div>

          <div>
            <label>Date of Birth <span class="required-mark">*</span></label>
            <input name="date_of_birth" type="date" required />
          </div>
          <div>
            <label>Riding Experience <span class="required-mark">*</span></label>
            <select name="riding_years" id="riding_years" required></select>
          </div>

          <div class="full">
            <label>Bike Model <span class="required-mark">*</span></label>
            <input name="bike_model" data-type="name" placeholder="Brand, Model, Year — e.g. Harley-Davidson, Street Glide, 2022" required />
          </div>

          <div class="full">
            <label>Profession / Occupation <span class="required-mark">*</span></label>
            <input name="profession" data-type="name" required />
          </div>

          <div>
            <label>Emergency Contact — Name <span class="required-mark">*</span></label>
            <input name="emergency_contact_name" data-type="name" required />
          </div>
          <div>
            <label>Emergency Contact — Relation <span class="required-mark">*</span></label>
            <input name="emergency_contact_relation" data-type="name" required />
          </div>
          <div class="full">
            <label>Emergency Contact — Mobile <span class="required-mark">*</span></label>
            <input name="emergency_contact_mobile" data-type="phone" required />
          </div>

          <div class="full">
            <label>Your Photo (clear face photo) <span class="required-mark">*</span></label>
            <div class="file-drop">
              <input type="file" id="photo_file" accept="image/*" required />
              <img id="photo_preview" class="preview" alt="Preview" />
            </div>
          </div>

          <div class="full">
            <label>Your Bike's Photo <span class="required-mark">*</span></label>
            <div class="file-drop">
              <input type="file" id="bike_photo_file" accept="image/*" required />
              <img id="bike_photo_preview" class="preview" alt="Preview" />
            </div>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="gold" style="width:100%; margin-top:20px;">Submit</button>
      </form>
      <div id="msg"></div>
    </div>
  </div>

  <script type="module" src="js/intake.js"></script>
</body>
</html>
